name: Build and push bot image

# 把 xcollector-bot 构建成镜像推到 GHCR，供 xcollector-deploy 的
# docker compose 直接拉取。
#
# 推的标签：
#   - 默认分支（main）→ latest
#   - 分支推送        → 分支名
#   - v1.2.3 这样的 tag → 1.2.3 / 1.2 / latest
#   - 每次提交        → sha-<短哈希>（想固定版本时用这个最稳）
#
# 首次推送后，去 GitHub 的 Packages 页面把包可见性设成 private 或 public
# （private 的话，部署机上要先 docker login ghcr.io）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 的镜像路径必须**全小写**，而 GitHub 用户名可能含大写字母
      # （例如 Xqy1y4ever）。直接把 ${{ github.repository }} 拼进镜像名会报
      # "repository name must be lowercase"，所以这里转一次小写。
      - name: 计算小写镜像名
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ vars.PYTHON_VERSION || '3.12' }}
            # 1 = 把 litellm 一起装进镜像。默认开，这样 EXTRACTOR=llm 开箱可用；
            # 只在用规则抽取、想省几百 MB 时，去仓库 Settings → Variables 里
            # 加一个 BUILD_LLM=0。
            BUILD_LLM=${{ vars.BUILD_LLM || '1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
